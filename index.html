<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>俺のローグライク</title>
<style>
  /* 全体の設定 */
  body {
    margin: 0; padding: 20px; background-color: #111; color: white;
    font-family: 'Georgia', serif;
    /* 画面中央寄せなどはハンドコンテナに任せる */
    display: flex; justify-content: center; 
  }

  /* カードを並べるエリア（手札） */
  #hand-container {
    display: flex; 
    flex-wrap: wrap; 
    justify-content: center; 
    gap: 20px;
    width: 100%;
    max-width: 1200px;
  }

  /* --- 以下、あなたが苦労して調整した黄金比CSS --- */
  .card {
    position: relative;
    width: 240px;
    height: 360px;
    background-color: #000;
    border-radius: 12px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    user-select: none; -webkit-user-select: none;
    overflow: hidden;
    cursor: pointer; /* クリックできる感 */
    transition: transform 0.1s; /* 押したときのアニメーション用 */
  }

  /* ちょっとした遊び心：押すと凹む */
  .card:active { transform: scale(0.95); }

  .card-art {
    position: absolute;
    top: 30px; left: 22px; width: 196px; height: 170px; 
    object-fit: cover; z-index: 1;
  }

  .card-frame-img {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    object-fit: fill; z-index: 2; pointer-events: none;
  }

  .card-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 3; }

  .card-cost {
    position: absolute;
    top: 0px; left: 5px; width: 70px; height: 70px; 
    display: flex; justify-content: center; align-items: center;
    font-size: 36px; font-weight: bold; color: #FFD700;
    text-shadow: 2px 2px 0 #000;
  }
  
  .card-title {
    position: absolute;
    top: 215px; left: 40px; width: 160px; 
    text-align: center; font-size: 15px; font-weight: bold; 
    color: #3d2e1e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
  }

  .card-desc {
    position: absolute;
    top: 235px; left: 35px; width: 170px; height: 85px;
    display: flex; justify-content: center; align-items: center; text-align: center;
    font-size: 13px; color: #3d2e1e; line-height: 1.5; font-weight: bold;
  }
</style>
</head>
<body>

  <div id="hand-container"></div>

  <script src="js/main.js"></script>

</body>
</html>
