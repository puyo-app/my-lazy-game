<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>俺のローグライク</title>
<style>
  /* 全体の設定 */
  body {
    margin: 0; padding: 20px; background-color: #111; color: white;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 20px;
    font-family: 'Georgia', serif;
  }

  /* --- カードコンテナ --- */
  .card {
    position: relative;
    width: 240px;
    height: 360px;
    background-color: #000;
    border-radius: 12px; /* 角丸を少し控えめに */
    box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    user-select: none; -webkit-user-select: none;
    overflow: hidden; /* はみ出し厳禁 */
  }

  /* --- レイヤー1：イラスト（一番下） --- */
  .card-art {
    position: absolute;
    /* 窓の位置に合わせてイラストの表示位置を調整 */
    top: 40px;  /* 上から少し下げて窓に合わせる */
    left: 20px; /* 左から少し空ける */
    width: 200px; /* 窓の幅に合わせる */
    height: 180px; /* 窓の高さに合わせる */
    object-fit: cover;
    z-index: 1;
  }

  /* --- レイヤー2：枠画像（真ん中） --- */
  .card-frame-img {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    object-fit: fill; /* 強制引き伸ばし */
    z-index: 2;
    pointer-events: none;
  }

  /* --- レイヤー3：UIテキスト（一番上） --- */
  .card-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 3; }

  /* ★修正：コスト（左上の丸） */
  .card-cost {
    position: absolute;
    /* 丸枠の位置に合わせてガッツリ左上に寄せる */
    top: 12px; 
    left: 10px;
    /* 丸のサイズに合わせる */
    width: 60px; 
    height: 60px; 
    display: flex; justify-content: center; align-items: center;
    /* 数字のデザイン */
    font-size: 36px; font-weight: bold; color: #FFD700;
    text-shadow: 2px 2px 0 #000; /* くっきりさせる黒縁 */
    /* デバッグ用：位置確認したければ下の行のコメントアウトを外す */
    /* border: 1px solid red; */
  }
  
  /* ★修正：タイトル（中央リボン） */
  .card-title {
    position: absolute;
    /* リボンの高さに合わせる */
    top: 212px; 
    /* リボンの幅と開始位置 */
    left: 40px; 
    width: 160px; 
    text-align: center; 
    font-size: 15px; font-weight: bold; 
    /* 白いリボンの上なので、濃い茶色にする */
    color: #3d2e1e; 
    /* 1行で収まらない時は「...」にする */
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
    /* border: 1px solid red; */
  }

  /* ★修正：説明文（下の四角） */
  .card-desc {
    position: absolute;
    /* 下枠の位置に合わせる */
    top: 255px;
    left: 35px; 
    width: 170px; 
    height: 85px;
    /* 上下左右中央揃え */
    display: flex; justify-content: center; align-items: center; text-align: center;
    font-size: 13px; 
    color: #3d2e1e; /* 濃い茶色 */
    line-height: 1.5; font-weight: bold;
    /* border: 1px solid red; */
  }
</style>
</head>
<body>

  <div class="card">
    <img src="assets/images/art_strike.png" class="card-art">
    <img src="assets/images/card_frame.png" class="card-frame-img">
    <div class="card-ui">
      <div class="card-cost">1</div>
      <div class="card-title">ストライク</div>
      <div class="card-desc">敵1体に<br>6ダメージを与える</div>
    </div>
  </div>

  <div class="card">
    <img src="assets/images/art_shield.png" class="card-art">
    <img src="assets/images/card_frame.png" class="card-frame-img">
    <div class="card-ui">
      <div class="card-cost">1</div>
      <div class="card-title">防御</div>
      <div class="card-desc">ブロックを<br>5得る</div>
    </div>
  </div>

  <div class="card">
    <img src="assets/images/art_potion.png" class="card-art">
    <img src="assets/images/card_frame.png" class="card-frame-img">
    <div class="card-ui">
      <div class="card-cost">0</div>
      <div class="card-title">ポーション</div>
      <div class="card-desc">HPを<br>10回復する</div>
    </div>
  </div>

</body>
</html>
