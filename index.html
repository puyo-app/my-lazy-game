<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>俺のローグライク</title>
<style>
  body {
    margin: 0; padding: 20px; background-color: #111; color: white;
    font-family: 'Georgia', serif;
    display: flex; flex-direction: column; align-items: center; /* 縦並び中央揃え */
    min-height: 100vh;
  }

  /* バトルステータスバー */
  #battle-status {
    width: 100%; max-width: 1200px; 
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; 
    color: #FFD700; font-weight: bold; font-size: 18px;
    text-shadow: 1px 1px 2px black;
  }
  .status-btn {
    padding: 10px 25px; background: #333; color: white; 
    border: 2px solid #FFD700; border-radius: 8px;
    font-weight: bold; cursor: pointer; transition: 0.2s;
  }
  .status-btn:active { transform: scale(0.95); background: #555; }

  /* 手札エリア */
  #hand-container {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 15px;
    width: 100%; max-width: 1200px;
    padding-bottom: 50px; /* スクロール余白 */
  }

  /* カード本体スタイル */
  .card {
    position: relative; width: 240px; height: 360px;
    background-color: #000; border-radius: 12px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    user-select: none; -webkit-user-select: none;
    overflow: hidden; cursor: pointer; transition: transform 0.1s;
    flex-shrink: 0; /* スマホで潰れないように */
  }
  .card:active { transform: scale(0.95); }

  /* カード内部要素 (黄金比設定) */
  .card-art {
    position: absolute; top: 30px; left: 22px; width: 196px; height: 170px; 
    object-fit: cover; z-index: 1;
  }
  .card-frame-img {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    object-fit: fill; z-index: 2; pointer-events: none;
  }
  .card-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 3; }
  
  .card-cost {
    position: absolute; top: 0px; left: 5px; width: 70px; height: 70px; 
    display: flex; justify-content: center; align-items: center;
    font-size: 36px; font-weight: bold; color: #FFD700; text-shadow: 2px 2px 0 #000;
  }
  .card-title {
    position: absolute; top: 215px; left: 40px; width: 160px; 
    text-align: center; font-size: 15px; font-weight: bold; 
    color: #3d2e1e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
  }
  .card-desc {
    position: absolute; top: 235px; left: 35px; width: 170px; height: 85px;
    display: flex; justify-content: center; align-items: center; text-align: center;
    font-size: 13px; color: #3d2e1e; line-height: 1.4; font-weight: bold;
  }
</style>
</head>
<body>

  <div id="battle-status">
    <div id="draw-pile-count">山札: 0</div>
    <div>
        <button onclick="endTurn()" class="status-btn">ターン終了</button>
    </div>
    <div id="discard-pile-count">捨て札: 0</div>
  </div>

  <div id="hand-container"></div>

  <script src="js/main.js"></script>
</body>
</html>
