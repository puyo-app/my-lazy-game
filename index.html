<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>俺のローグライク</title>
<style>
  /* 全体の設定 */
  body {
    margin: 0; padding: 20px; background-color: #111; color: white;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 20px;
    font-family: 'Georgia', serif;
  }

  /* --- カードコンテナ --- */
  .card {
    position: relative;
    width: 240px;
    height: 360px;
    background-color: #000; /* 万が一の隙間用 */
    border-radius: 15px; /* 枠の形状に合わせて調整 */
    box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    /* 重要：スマホで長押し選択されないようにする */
    user-select: none; -webkit-user-select: none;
  }

  /* --- レイヤー1：イラスト（一番下） --- */
  .card-art {
    position: absolute;
    /* イラストを「少し上寄り」に配置して、窓から確実に見えるようにする */
    top: 5%; 
    left: 5%;
    width: 90%; 
    height: 60%; /* カードの上半分くらいをカバーできればOK */
    object-fit: cover;
    z-index: 1; /* フレームの下 */
  }

  /* --- レイヤー2：枠画像（真ん中） --- */
  /* ここが「蓋」の役割をします。イラスト以外の部分は不透明な画像を使います */
  .card-frame-img {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    object-fit: fill;
    z-index: 2; /* イラストの上 */
    pointer-events: none;
  }

  /* --- レイヤー3：UIテキスト（一番上） --- */
  .card-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 3; }

  /* コスト：丸枠の真ん中に来るように微調整 */
  .card-cost {
    position: absolute;
    top: 0px; left: 0px; /* 枠画像の丸の位置に合わせて調整 */
    width: 85px; height: 85px; /* 丸枠より少し大きめに判定を取ってセンター合わせ */
    display: flex; justify-content: center; align-items: center;
    font-size: 38px; font-weight: bold; color: #FFD700;
    text-shadow: 3px 3px 0 #000; /* 視認性アップ */
  }
  
  /* タイトル：リボンの中央 */
  .card-title {
    position: absolute;
    top: 58%; /* 上から58%の位置（リボンの位置に合わせて調整） */
    left: 10%; width: 80%; /* 左右に少し余白を持たせる */
    text-align: center; font-size: 16px; font-weight: bold; color: #3d2e1e;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
  }

  /* 説明文：下部のテキストエリア */
  .card-desc {
    position: absolute;
    bottom: 8%; /* 下から8%の位置 */
    left: 10%; width: 80%; height: 20%;
    display: flex; justify-content: center; align-items: center; text-align: center;
    font-size: 13px; color: #3d2e1e; line-height: 1.4; font-weight: bold;
  }

</style>
</head>
<body>

  <div class="card">
    <img src="assets/images/art_strike.png" class="card-art">
    <img src="assets/images/card_frame.png" class="card-frame-img">
    <div class="card-ui">
      <div class="card-cost">1</div>
      <div class="card-title">ストライク</div>
      <div class="card-desc">敵1体に<br>6ダメージを与える</div>
    </div>
  </div>

  <div class="card">
    <img src="assets/images/art_shield.png" class="card-art">
    <img src="assets/images/card_frame.png" class="card-frame-img">
    <div class="card-ui">
      <div class="card-cost">1</div>
      <div class="card-title">防御</div>
      <div class="card-desc">ブロックを<br>5得る</div>
    </div>
  </div>

  <div class="card">
    <img src="assets/images/art_potion.png" class="card-art">
    <img src="assets/images/card_frame.png" class="card-frame-img">
    <div class="card-ui">
      <div class="card-cost">0</div>
      <div class="card-title">ポーション</div>
      <div class="card-desc">HPを<br>10回復する</div>
    </div>
  </div>

</body>
</html>
